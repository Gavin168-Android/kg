name: 批量更新 title / short

on:
  workflow_dispatch:   # 手动触发
    inputs:
      title:
        description: '新的 data.title 内容（留空则不更新 title）'
        required: false
        default: ''
      shorts:
        description: '新的 data.short 列表，逗号分隔，例如 A,B,C（留空则不更新 short）'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 推送改动回仓库
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行更新脚本
        run: |
          python -c '
          import json, glob, os

          NEW_TITLE = "${{ inputs.title }}"
          NEW_SHORTS = [s.strip() for s in "${{ inputs.shorts }}".split(",") if s.strip()] if "${{ inputs.shorts }}" else []
          FILE_PATTERN = "config/xm*.json"

          for filepath in glob.glob(FILE_PATTERN):
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if "data" not in data:
                      data["data"] = {}
                  changed = []
                  if NEW_TITLE:
                      old = data["data"].get("title")
                      data["data"]["title"] = NEW_TITLE
                      changed.append(f"title: {old} -> {NEW_TITLE}")
                  if NEW_SHORTS:
                      old = data["data"].get("short")
                      data["data"]["short"] = NEW_SHORTS
                      changed.append(f"short: {old} -> {NEW_SHORTS}")

                  if changed:
                      with open(filepath, "w", encoding="utf-8") as f:
                          json.dump(data, f, ensure_ascii=False, indent=2)
                      print(f"已修改: {filepath}  |  " + "; ".join(changed))
                  else:
                      print(f"无变更: {filepath}")
              except Exception as e:
                  print(f"处理失败 {filepath}: {e}")

          print("\n全部处理完成！")
          '

      - name: 提交并推送修改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/xm*.json
          if git diff --staged --quiet; then
            echo "没有需要提交的变更，跳过。"
            exit 0
          fi
          git commit -m "批量更新 config 下的 title/short 字段"
          git pull --rebase --autostash || true
          git push
